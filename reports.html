<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/assets/favicon-iml.png">
<link rel="stylesheet" href="/assets/reports.css">
<script src="/assets/reports.js" defer></script>
<title>Jottly Developer Reports</title>
</head>
<body>
  <header class="app-bar">
    <div class="brand-lockup">
      <img src="/assets/app_icon.png" alt="" width="44" height="44">
      <div><p class="eyebrow">Jottly</p><h1>Developer reports</h1></div>
    </div>
    <div class="toolbar" hidden>
      <label for="status">Status</label>
      <select id="status">
        <option value="new">New</option>
        <option value="in_progress">In progress</option>
        <option value="needs_info">Needs info</option>
        <option value="fixed">Fixed</option>
        <option value="all">Recent</option>
      </select>
      <button id="refresh" type="button">Refresh</button>
      <span id="sample-indicator" hidden>Sample data</span>
      <button id="exit-sample" type="button" hidden>Exit Preview</button>
      <button id="signout" type="button">Lock</button>
    </div>
  </header>
  <main>
    <form id="auth-form" class="auth-form">
      <label for="token-input">Dashboard token</label>
      <input id="token-input" type="password" autocomplete="off" required>
      <button type="submit">Unlock reports</button>
      <button id="sample" type="button">Preview Sample Tickets</button>
    </form>
    <p id="notice" role="status" aria-live="polite">Enter your dashboard token to view reports.</p>
    <p id="sample-banner" hidden>Sample tickets only. Nothing here is saved or sent to the report inbox.</p>
    <div class="workspace" hidden>
      <div class="table-scroll">
        <table aria-label="Developer reports">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Description</th>
              <th scope="col">Status</th>
              <th scope="col">Diagnostics</th>
            </tr>
          </thead>
          <tbody id="tickets"></tbody>
        </table>
      </div>
    </div>
  </main>
</body>
</html>
